# Runs on the VPS in /var/www/sajib/projects/employee-assistant (personal domain, sajib-net).
#   cd /var/www/sajib/projects/employee-assistant && git pull origin main && docker compose up -d --build
# No ports are published: Caddy reaches this container as employee-assistant:5004 over sajib-net.
# The database (Neon Postgres) is external, so there is nothing to run or back up here.

services:
  employee-assistant:
    container_name: employee-assistant
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
    networks:
      - sajib-net
    volumes:
      - agent_logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5004/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  sajib-net:
    external: true

volumes:
  agent_logs:
